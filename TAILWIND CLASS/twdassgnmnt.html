<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <main class="bg-white h-screen w-auto p-10 grid grid-cols-3 gap-10">
    <section class="h-120 w-80 bg-white grid grid-cols-2 grid-rows-10 gap-5 border-4 border-blue-950 p-2">
      <div class="bg-blue-950 col-span-2 row-span-2"></div>
      <div class="bg-blue-950 col-span-1 row-span-4"></div>
      <div class="bg-blue-950 col-span-1 row-span-2"></div>
      <div class="bg-blue-950 col-span-1 row-span-2"></div>
      <div class="bg-blue-950 col-span-2 row-span-3"></div>
      <div class="bg-blue-950 col-span-2 row-span-1"></div>
    </section>

    <section class="h-120 w-80 bg-white grid grid-cols-2 grid-rows-10 gap-2 border-4 border-green-500 p-2">
      <div class=" bg-red-400 col-span-2 row-span-2"></div>

      <section class="col-span-2 row-span-4 flex w-80">
        <section class="border-4 border-r-2 border-green-500 p-2 grid w-37">
            <div class="bg-red-400 p-5"></div>
        </section>

        <section class="border-4 border-l-2 border-green-500 p-2 w-37 grid grid-rows-2 gap-5">
            <div class=" bg-red-400 row-span-1"></div>
            <div class=" bg-red-400 row-span-1"></div>
        </section>
      </section>

      <div class=" bg-red-400 col-span-2 row-span-3"></div>

      <div class=" bg-red-400 col-span-2 row-span-1 "></div>
    </section>
    
    <section class="h-120 w-80 bg-white grid grid-cols-2 grid-rows-10 gap-5 border-4 border-red-400 p-2">
      <div class=" bg-blue-950 col-span-2 row-span-2"></div>
      <div class=" bg-blue-950 col-span-1 row-span-4"></div>
      <div class=" bg-blue-950 col-span-1 row-span-2"></div>
      <div class=" bg-blue-950 col-span-1 row-span-2"></div>
      <div class=" bg-blue-950 col-span-2 row-span-3"></div>
      <div class=" bg-blue-950 col-span-2 row-span-1"></div>
    </section>
  </main>
</body>
</html>
